const colors = [

    "red",
    "orange",
    "yellow",
    "green",
    "blue",
    "indigo",
    "violet"
    
];

// ======================================
// SPHERE
// ======================================

const levelCount = 33;

let sphereItems = [];
let sequenceForward = false;


let phase = Math.PI;



let colorIndex = 0;
let previousDirection = 1;

// ======================================
// CREATE ITEM
// ======================================
function nextIndex(i){

    return (
        i + 1
    ) % numbers.length;
}

function prevIndex(i){

    return (
        i - 1 +
        numbers.length
    ) % numbers.length;
}
function createTopItem(){

    let newIndex;

    if(
        sphereItems.length === 0
    ){

        // Start from the LAST text
        newIndex =
            numbers.length - 1;

    }
    else{

        newIndex =
            prevIndex(
                sphereItems[0].index
            );
    }

    sphereItems.unshift({

        index:
            newIndex,

        value:
            String(
                numbers[newIndex]
            ),

        color:
            colors[colorIndex],

        level:
            0

    });

    colorIndex =
        (colorIndex + 1)
        %
        colors.length;

 
}

function createBottomStartItem(){

    const newIndex = 0;

    sphereItems.push({

        index:
            newIndex,

        value:
            String(
                numbers[newIndex]
            ),

        color:
            colors[colorIndex],

        level:
            levelCount - 1

    });

    colorIndex =
        (
            colorIndex + 1
        )
        %
        colors.length;
}
// ======================================

       sphere.appendChild(div);

}



// ======================================
// MOVEMENT
// ======================================


function moveForward(step){

    sphereItems.forEach(item=>{
        item.level += step;
    });

    sphereItems =
        sphereItems.filter(
            item => item.level < levelCount
        );

    if(
        sphereItems.length === 0 ||
        sphereItems[0].level >= 1
    ){
        createTopItem();
    }
}

  
function moveBackward(step){

    sphereItems.forEach(item=>{
        item.level -= step;
    });

    sphereItems =
        sphereItems.filter(
            item => item.level >= 0
        );

    if(
        sphereItems.length === 0 ||
        sphereItems[sphereItems.length-1].level <= levelCount-2
    ){

      
colorIndex =
    (
        colorIndex - 1 +
        colors.length
    )

    colors.length;


const newIndex =

    sphereItems.length === 0
    ? numbers.length - 1
    : nextIndex(
        sphereItems[
            sphereItems.length - 1
        ].index
    );

sphereItems.push({

    index:
        newIndex,

    value:
        String(
            numbers[newIndex]
        ),

    color:
        colors[colorIndex],

    level:
        levelCount - 1

});

    }
}

// ======================================
// SINUSOID
// ======================================

let previousTimestamp = null;

function loop(timestamp){

    if(previousTimestamp === null){
        previousTimestamp = timestamp;
    }

    // Real elapsed time in seconds
    let deltaTime =
        (timestamp - previousTimestamp) / 1000;

    previousTimestamp = timestamp;

    // Prevent a huge jump if the browser stalls
    deltaTime =
        Math.min(deltaTime, 0.05);


const cycleDuration =  177.6043360433;


    // Completely time-based sinusoid
    //
    // Math.PI / cycleDuration means:
    // one half-wave in cycleDuration seconds
    // one complete sine cycle in 2 * cycleDuration seconds

    phase +=
        Math.PI *
        deltaTime  /
        cycleDuration;


    const wave =
        Math.sin(phase);
  

    const direction =
        wave >= 0
        ? 1
        : -1;


    const speed =
        Math.abs(wave);


const minInterval = 173.441734417344; 
const maxInterval = 346.883468834688;
const movementScale = 2775.0677506774;

    const equivalentInterval =
        maxInterval -
        speed *
        (
            maxInterval -
            minInterval
        );


    // ==========================================
    // REAL-TIME MOVEMENT
    // ==========================================

    // Original calibration was:
    //
    // 30 / equivalentInterval per frame
    //
    // At 60 FPS this corresponds to:
    //
    // (30 / equivalentInterval) * 60
    // levels per second.

  const movementSpeed =
    movementScale /
    equivalentInterval;

const step =
    movementSpeed * deltaTime;


    if(direction > 0){

        moveForward(step);

    }
    else{

        moveBackward(step);

    }


    drawSphere();


    requestAnimationFrame(
        loop
    );
}

async function keepScreenAwake() {
    try {
        wakeLock = await navigator.wakeLock.request("screen");

        wakeLock.addEventListener("release", () => {
            console.log("Wake Lock released");
        });

        console.log("Screen Wake Lock active");

    } catch (err) {
        console.log("Wake Lock error:", err);
    }
}

document.addEventListener("visibilitychange", async () => {

    if (
        wakeLock !== null &&
        document.visibilityState === "visible"
    ) {
        await keepScreenAwake();
    }

});
